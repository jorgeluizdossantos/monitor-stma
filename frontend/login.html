<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STMA - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f7f4ed; color: #1c1c1c; }
        .font-mono-tech { font-family: 'JetBrains Mono', monospace; }
        .btn-lovable {
            background-color: #1c1c1c; color: #fcfbf8;
            box-shadow: rgba(255, 255, 255, 0.2) 0px 0.5px 0px 0px inset, rgba(0, 0, 0, 0.2) 0px 0px 0px 0.5px inset;
        }
        .btn-lovable:active { opacity: 0.8; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-[#f7f4ed] border border-[#eceae4] p-8 rounded-[12px] shadow-sm">
        <div class="mb-6 text-center">
            <span class="text-[11px] font-mono-tech uppercase tracking-wider text-[#5f5f5d] block">STMA Core v1.0</span>
            <h1 class="text-[24px] font-bold text-[#1c1c1c]">Acessar o Sistema</h1>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label for="email" class="block text-[12px] font-bold uppercase text-[#5f5f5d] mb-1">E-mail</label>
                <input type="email" id="email" required placeholder="seu.email@empresa.com" class="w-full px-3.5 py-2.5 bg-white/60 border border-[#eceae4] rounded-[6px] text-[14px] text-[#1c1c1c] focus:outline-none focus:border-[#1c1c1c] transition-colors">
            </div>

            <div>
                <label for="senha" class="block text-[12px] font-bold uppercase text-[#5f5f5d] mb-1">Palavra-passe</label>
                <input type="password" id="senha" required placeholder="••••••••" class="w-full px-3.5 py-2.5 bg-white/60 border border-[#eceae4] rounded-[6px] text-[14px] text-[#1c1c1c] focus:outline-none focus:border-[#1c1c1c] transition-colors">
            </div>

            <button type="submit" class="w-full py-3 btn-lovable font-medium text-[14px] rounded-[6px] transition-all">Entrar no STMA</button>

            <div id="erroMsg" class="hidden text-center text-[13px] text-red-600 bg-red-50 border border-red-200 p-2.5 rounded-[6px] font-medium"></div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value.trim();
            const erroMsg = document.getElementById('erroMsg');

            erroMsg.classList.add('hidden');
            erroMsg.textContent = '';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });

                const data = await response.json();

                if (response.ok) {
                    window.location.href = 'dashboard.html';
                } else {
                    erroMsg.textContent = data.error || 'E-mail ou palavra-passe incorretos.';
                    erroMsg.classList.remove('hidden');
                }
            } catch (error) {
                console.error('Erro na requisição de login:', error);
                erroMsg.textContent = 'Erro de conexão com o servidor backend.';
                erroMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
