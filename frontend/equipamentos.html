<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STMA - Cadastro de Equipamentos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f7f4ed; color: #1c1c1c; }
        .font-mono-tech { font-family: 'JetBrains Mono', monospace; }
        .btn-lovable-primary {
            background-color: #1c1c1c; color: #fcfbf8;
            box-shadow: rgba(255, 255, 255, 0.2) 0px 0.5px 0px 0px inset, rgba(0, 0, 0, 0.2) 0px 0px 0px 0.5px inset;
        }
        .btn-ghost { background: transparent; border: 1px solid rgba(28,28,28,0.4); border-radius: 6px; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-6">

    <div class="max-w-4xl w-full mx-auto space-y-8 my-auto">
        <div class="flex justify-between items-center border-b border-[#eceae4] pb-4">
            <div>
                <span class="text-[12px] font-mono-tech uppercase tracking-wider text-[#5f5f5d]">tabela: equipamentos</span>
                <h1 class="text-[28px] font-bold text-[#1c1c1c]">Vincular Hardware / Equipamento</h1>
            </div>
            <a href="dashboard.html" class="px-3.5 py-1.5 text-[13px] font-mono-tech btn-ghost">Voltar ao Painel</a>
        </div>

        <div class="bg-[#f7f4ed] border border-[#eceae4] p-6 rounded-[12px]">
            <form onsubmit="salvarEquipamento(event)" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[12px] font-bold uppercase text-[#5f5f5d] mb-1">Empresa</label>
                        <select id="eq_empresa_id" required class="w-full px-3 py-2 bg-[#f7f4ed] border border-[#eceae4] rounded-[6px] text-[13px]">
                        </select>
                    </div>
                    <div>
                        <label class="block text-[12px] font-bold uppercase text-[#5f5f5d] mb-1">Setor ID</label>
                        <input type="number" id="eq_setor_id" required class="w-full px-3 py-2 bg-[#f7f4ed] border border-[#eceae4] rounded-[6px] text-[13px]" placeholder="Ex: 10">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[12px] font-bold uppercase text-[#5f5f5d] mb-1">Equipamento ID (`equipamento_id`)</label>
                        <input type="number" id="eq_id" required class="w-full px-3 py-2 bg-[#f7f4ed] border border-[#eceae4] rounded-[6px] text-[13px]" placeholder="Ex: 101">
                    </div>
                    <div>
                        <label class="block text-[12px] font-bold uppercase text-[#5f5f5d] mb-1">Nome do Equipamento (`equioamento_name`)</label>
                        <input type="text" id="eq_name" required class="w-full px-3 py-2 bg-[#f7f4ed] border border-[#eceae4] rounded-[6px] text-[13px]" placeholder="Ex: Arduino Sensor DHT22 - Freezer">
                    </div>
                </div>

                <button type="submit" class="w-full py-3 btn-lovable-primary font-medium text-[14px] rounded-[6px]">Salvar Equipamento no Banco</button>
            </form>
        </div>
    </div>

    <script src="js/stma-api.js"></script>
    <script>
        async function carregarSelects() {
            try {
                await STMA.me();
                const empresas = await STMA.listarEmpresas();
                const selectEmp = document.getElementById('eq_empresa_id');
                const empresaSalva = STMA.getEmpresaFiltro();
                selectEmp.innerHTML = '<option value="">Selecione...</option>' + empresas.map(e => `<option value="${e.empresa_id}">${e.nome_empresa}</option>`).join('');
                if (empresaSalva) {
                    selectEmp.value = empresaSalva;
                }
            } catch (error) {
                window.location.href = 'login.html';
            }
        }

        async function salvarEquipamento(e) {
            e.preventDefault();

            const equipamento = {
                empresa_id: parseInt(document.getElementById('eq_empresa_id').value, 10),
                setor_id: parseInt(document.getElementById('eq_setor_id').value, 10),
                equipamento_id: parseInt(document.getElementById('eq_id').value, 10),
                equioamento_name: document.getElementById('eq_name').value.trim()
            };

            try {
                await STMA.cadastrarEquipamento(equipamento);
                STMA.setEmpresaFiltro(equipamento.empresa_id);
                alert('Equipamento cadastrado com sucesso!');
                e.target.reset();
                document.getElementById('eq_empresa_id').value = equipamento.empresa_id;
            } catch (error) {
                alert(error.message || 'Erro ao cadastrar equipamento.');
            }
        }

        carregarSelects();
    </script>
</body>
</html>
